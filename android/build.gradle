// =============================================================================
// 仅用于 Android Studio 打开 / 浏览工程；**正式构建不走 Gradle**。
// 正式构建：python tools/build_apk.py（aapt2 link + javac -source 8 -target 8 + d8
//           + zipalign + apksigner 手动链，无网络、无第三方依赖）。
//
// 版本唯一来源是 android/app/src/main/AndroidManifest.xml；
// 内容内置版本 BUNDLED_CONTENT_VERSION 由构建脚本替换 AppConfig.java 中的数字。
// =============================================================================

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 仅 IDE 同步用；APK 构建链不使用 AGP。
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
